<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="alokGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F0A"/>
      <stop offset="50%" stop-color="#FF375F"/>
      <stop offset="100%" stop-color="#BF5AF2"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFD60A" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FF9F0A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF375F" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="#0D0E12" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  
  <!-- Ambient Radiance -->
  <circle cx="256" cy="180" r="160" fill="url(#sunGlow)"/>

  <!-- Radiant Beams / Rays of Light -->
  <g opacity="0.75" stroke="url(#alokGrad)" stroke-width="3" stroke-linecap="round">
    <line x1="256" y1="60" x2="256" y2="100"/>
    <line x1="160" y1="85" x2="185" y2="120"/>
    <line x1="352" y1="85" x2="327" y2="120"/>
    <line x1="85" y1="160" x2="120" y2="185"/>
    <line x1="427" y1="160" x2="392" y2="185"/>
  </g>

  <!-- Luminous Rising Sun / Source of Light -->
  <circle cx="256" cy="190" r="44" fill="url(#alokGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="190" r="36" fill="#FFF275"/>

  <!-- The Converging Ascending Path of Sovereignty (আলোকপথ) -->
  <polygon points="256,220 330,420 182,420" fill="url(#pathGrad)"/>
  
  <!-- Subtle Pathway Stepping Accents -->
  <line x1="218" y1="380" x2="294" y2="380" stroke="#0D0E12" stroke-width="4" stroke-linecap="round"/>
  <line x1="230" y1="340" x2="282" y2="340" stroke="#0D0E12" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="300" x2="272" y2="300" stroke="#0D0E12" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="248" y1="260" x2="264" y2="260" stroke="#0D0E12" stroke-width="2" stroke-linecap="round"/>
</svg>