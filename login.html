<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Log in — ChatGPT (Alora AI)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=3">
  <link rel="shortcut icon" href="favicon.ico?v=3">

  <style>
    :root {
      --bg: #212121;
      --card-bg: #212121;
      --text-primary: #ececec;
      --text-secondary: #b4b4b4;
      --text-muted: #8e8e8e;
      --border: rgba(255, 255, 255, 0.15);
      --border-focus: #10a37f;
      --input-bg: #2f2f2f;
      --btn-primary: #10a37f;
      --btn-primary-hover: #0e8c6d;
      --btn-text: #ffffff;
      --social-btn-bg: transparent;
      --social-btn-hover: #2f2f2f;
      --danger: #ef4444;
      --radius: 8px;
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --card-bg: #ffffff;
      --text-primary: #2d333a;
      --text-secondary: #6e7681;
      --text-muted: #8c959f;
      --border: #d0d7de;
      --border-focus: #10a37f;
      --input-bg: #ffffff;
      --btn-primary: #10a37f;
      --btn-primary-hover: #0e8c6d;
      --btn-text: #ffffff;
      --social-btn-bg: #ffffff;
      --social-btn-hover: #f6f8fa;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 32px 16px 24px;
      -webkit-font-smoothing: antialiased;
    }

    .auth-container {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
    }

    .brand-logo-wrap {
      margin-bottom: 24px;
      cursor: pointer;
    }
    .brand-logo-img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .auth-title {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 24px;
      text-align: center;
      color: var(--text-primary);
    }

    .auth-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }

    .input-field {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .input-field:focus {
      border-color: var(--border-focus);
    }
    .input-field::placeholder {
      color: var(--text-muted);
    }

    .password-toggle-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .password-toggle-btn:hover {
      color: var(--text-primary);
    }

    .error-alert {
      padding: 10px 14px;
      border-radius: var(--radius);
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--danger);
      font-size: 0.86rem;
      display: none;
      line-height: 1.45;
    }

    .continue-btn {
      width: 100%;
      height: 52px;
      background: var(--btn-primary);
      color: var(--btn-text);
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, opacity 0.15s ease;
      margin-top: 4px;
    }
    .continue-btn:hover {
      background: var(--btn-primary-hover);
    }
    .continue-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .auth-toggle-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-top: 14px;
    }
    .auth-toggle-link {
      color: var(--border-focus);
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .auth-toggle-link:hover {
      text-decoration: underline;
    }

    .divider-row {
      display: flex;
      align-items: center;
      width: 100%;
      margin: 24px 0;
      color: var(--text-muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .divider-row::before,
    .divider-row::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider-row span {
      padding: 0 14px;
    }

    .social-btn {
      width: 100%;
      height: 52px;
      background: var(--social-btn-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-size: 0.95rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: background-color 0.15s ease;
      text-decoration: none;
      margin-bottom: 10px;
    }
    .social-btn:hover {
      background: var(--social-btn-hover);
    }

    .auth-footer {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 24px;
    }
    .auth-footer a {
      color: var(--text-muted);
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <a href="/" class="brand-logo-wrap" title="Go to ChatGPT">
      <img src="alokpath_icon_dark.png" alt="ChatGPT" class="brand-logo-img">
    </a>

    <h1 class="auth-title" id="authHeading">Welcome back</h1>

    <div class="error-alert" id="errorAlert"></div>

    <form class="auth-form" id="mainAuthForm">
      <div class="input-group" id="nameGroup" style="display: none;">
        <input type="text" class="input-field" id="nameInput" placeholder="Full name">
      </div>

      <div class="input-group">
        <input type="email" class="input-field" id="emailInput" placeholder="Email address" required>
      </div>

      <div class="input-group">
        <input type="password" class="input-field" id="passwordInput" placeholder="Password" minlength="6" required>
        <button type="button" class="password-toggle-btn" id="passwordToggleBtn" aria-label="Toggle password">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <button type="submit" class="continue-btn" id="submitBtn">Continue</button>
    </form>

    <div class="auth-toggle-row">
      <span id="togglePrompt">Don't have an account?</span>
      <a class="auth-toggle-link" id="toggleLink">Sign up</a>
    </div>

    <div class="divider-row">
      <span>OR</span>
    </div>

    <button type="button" class="social-btn" id="googleAuthBtn">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <a href="/" class="social-btn" onclick="try{localStorage.removeItem('alokpoth_guest_count');}catch(e){}">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      <span>Stay logged out (Continue as Guest)</span>
    </a>

    <a href="download" class="social-btn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span>Download Android App (APK)</span>
    </a>
  </div>

  <footer class="auth-footer">
    <a href="help">Terms of use</a>
    <span>|</span>
    <a href="help">Privacy policy</a>
    <span>•</span>
    <span>আলোকপথ</span>
  </footer>

  <script>
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const BACKEND_URL = (isLocal && window.location.port === '5000') 
      ? '' 
      : (window.location.origin.includes('localhost') ? 'http://localhost:5000' : 'https://alora-backend-emw3.onrender.com');
    const API_BASE = (BACKEND_URL ? BACKEND_URL : '') + "/api";

    let mode = "login"; // "login" or "signup"

    const heading = document.getElementById("authHeading");
    const nameGroup = document.getElementById("nameGroup");
    const nameInput = document.getElementById("nameInput");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const submitBtn = document.getElementById("submitBtn");
    const togglePrompt = document.getElementById("togglePrompt");
    const toggleLink = document.getElementById("toggleLink");
    const errorAlert = document.getElementById("errorAlert");
    const pwToggle = document.getElementById("passwordToggleBtn");

    // Check URL parameters for mode
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get("mode") === "signup" || urlParams.get("mode") === "register") {
      setMode("signup");
    }

    function setMode(newMode) {
      mode = newMode;
      errorAlert.style.display = "none";
      if (mode === "signup") {
        document.title = "Sign up — ChatGPT (Alora AI)";
        heading.textContent = "Create your account";
        nameGroup.style.display = "flex";
        nameInput.required = true;
        submitBtn.textContent = "Continue";
        togglePrompt.textContent = "Already have an account?";
        toggleLink.textContent = "Log in";
      } else {
        document.title = "Log in — ChatGPT (Alora AI)";
        heading.textContent = "Welcome back";
        nameGroup.style.display = "none";
        nameInput.required = false;
        submitBtn.textContent = "Continue";
        togglePrompt.textContent = "Don't have an account?";
        toggleLink.textContent = "Sign up";
      }
    }

    toggleLink.addEventListener("click", () => {
      setMode(mode === "login" ? "signup" : "login");
    });

    pwToggle.addEventListener("click", () => {
      const isPw = passwordInput.type === "password";
      passwordInput.type = isPw ? "text" : "password";
      pwToggle.innerHTML = isPw 
        ? `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>`
        : `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
    });

    document.getElementById("mainAuthForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      errorAlert.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Please wait...";

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      const name = nameInput.value.trim();

      const endpoint = mode === "signup" ? "/auth/register" : "/auth/login";
      const requestData = mode === "signup" ? { name, email, password } : { email, password };

      try {
        const res = await fetch(`${API_BASE}${endpoint}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(requestData)
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          throw new Error(data.error || "Authentication failed. Please check your credentials.");
        }

        // Save auth data
        localStorage.setItem("alokpoth_token", data.token);
        if (data.user) {
          localStorage.setItem("alokpoth_user", JSON.stringify(data.user));
          if (data.user.subscription && data.user.subscription.plan_name) {
            localStorage.setItem("alokpoth_current_plan", data.user.subscription.plan_name);
          }
        }

        // Return to app
        const returnUrl = urlParams.get("redirect") || "/";
        window.location.href = returnUrl;
      } catch (err) {
        errorAlert.textContent = err.message;
        errorAlert.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Continue";
      }
    });

    // Google OAuth Handler
    document.getElementById("googleAuthBtn")?.addEventListener("click", async () => {
      try {
        const res = await fetch(`${API_BASE}/auth/google`);
        const data = await res.json();
        if (res.ok && data.url) {
          window.location.href = data.url;
        } else {
          errorAlert.textContent = data.error || "Google Sign-In is temporarily unavailable. Please use email and password.";
          errorAlert.style.display = "block";
        }
      } catch (e) {
        errorAlert.textContent = "Google Sign-In is temporarily unavailable. Please use email and password.";
        errorAlert.style.display = "block";
      }
    });
  </script>
</body>
</html>
