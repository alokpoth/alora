<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#212121">
  <title>App Language — Alora</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3">
  <link rel="shortcut icon" href="/favicon.ico?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #000000;
      --bg-card: #121215;
      --bg-card-hover: #1c1c22;
      --border-card: rgba(255, 255, 255, 0.09);
      --border-divider: rgba(255, 255, 255, 0.06);
      --text-main: #ececec;
      --text-sub: #a1a1aa;
      --text-dim: #71717a;
      --accent-blue: #ececec;
      --accent-ink: #0d0d0d;
      --accent-blue-hover: #ffffff;
      --font-main: 'Plus Jakarta Sans', 'Hind Siliguri', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    [data-theme="oled"] {
      --bg-base: #000000;
      --bg-card: #111114;
      --bg-card-hover: #1a1a20;
      --border-card: rgba(255, 255, 255, 0.1);
      --border-divider: rgba(255, 255, 255, 0.06);
      --text-main: #ececec;
      --text-sub: #a1a1aa;
      --text-dim: #71717a;
      --accent-blue: #ececec;
      --accent-ink: #0d0d0d;
    }

    [data-theme="sapphire"] {
      --bg-base: #070d19;
      --bg-card: #0e1a30;
      --bg-card-hover: #152646;
      --border-card: rgba(56, 189, 248, 0.18);
      --border-divider: rgba(56, 189, 248, 0.08);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-dim: #64748b;
      --accent-blue: #ececec;
      --accent-ink: #0d0d0d;
    }

    [data-theme="light"] {
      --bg-base: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #ececec;
      --border-card: rgba(0, 0, 0, 0.08);
      --border-divider: rgba(0, 0, 0, 0.06);
      --text-main: #0d0d0d;
      --text-sub: #64748b;
      --text-dim: #94a3b8;
      --accent-blue: #0d0d0d;
      --accent-ink: #ffffff;
    }

    [data-theme="eyecare"] {
      --bg-base: #f5eedc;
      --bg-card: #eadeca;
      --bg-card-hover: #dfcfb8;
      --border-card: rgba(146, 64, 14, 0.16);
      --border-divider: rgba(146, 64, 14, 0.08);
      --text-main: #4a3b2c;
      --text-sub: #7a6b5c;
      --text-dim: #9c8a77;
      --accent-blue: #2d2318;
      --accent-ink: #f5eedc;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      padding-top: env(safe-area-inset-top, 0);
      padding-bottom: max(32px, env(safe-area-inset-bottom, 20px));
      transition: background-color 0.2s ease;
    }

    /* Top Navigation Bar */
    .settings-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 16px;
    }

    .settings-back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      padding: 7px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-card);
      transition: opacity 0.15s, background 0.15s;
    }
    :root[data-theme="light"] .settings-back-link {
      background: rgba(0, 0, 0, 0.04);
    }
    .settings-back-link:active {
      opacity: 0.75;
      transform: scale(0.98);
    }
    .settings-back-link svg {
      width: 17px;
      height: 17px;
      stroke-width: 2.2;
      stroke: currentColor;
      fill: none;
    }

    .nav-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lang-pill-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-card);
      color: var(--text-main);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }
    :root[data-theme="light"] .lang-pill-btn {
      background: rgba(0, 0, 0, 0.04);
    }
    .lang-pill-btn:active {
      transform: scale(0.96);
    }

    /* Main Container */
    .content-container {
      width: 100%;
      max-width: 600px;
      margin: 20px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .settings-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 22px;
      box-shadow: none;
    }

    .card-title {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title svg {
      width: 20px;
      height: 20px;
      color: var(--accent-blue);
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }
    .card-desc {
      font-size: 0.88rem;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    /* Option Cards */
    .option-card-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1.5px solid var(--border-card);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
      user-select: none;
      -webkit-user-select: none;
    }
    :root[data-theme="light"] .option-card {
      background: rgba(0, 0, 0, 0.02);
    }
    .option-card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(255, 255, 255, 0.2);
    }
    :root[data-theme="light"] .option-card:hover {
      border-color: rgba(0, 0, 0, 0.16);
    }
    .option-card.active {
      border-color: var(--accent-blue);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: none;
    }
    .option-card:focus-visible {
      outline: 2px solid var(--accent-blue);
      outline-offset: 2px;
    }
    .option-lead {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .option-icon-badge {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .option-card.active .option-icon-badge {
      background: rgba(255, 255, 255, 0.16);
      border-color: var(--accent-blue);
    }
    .option-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    .option-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .option-desc {
      font-size: 0.82rem;
      color: var(--text-sub);
      line-height: 1.35;
    }
    .option-check {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent-blue);
      color: var(--accent-ink, #0d0d0d);
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-left: 12px;
    }
    .option-check svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.6;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .option-card.active .option-check {
      display: flex;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 500;
      color: #ffffff;
      background: rgba(24, 24, 27, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: none;
      z-index: 1000;
      display: none;
      backdrop-filter: none;
      white-space: nowrap;
    }
    .toast.success { border-color: rgba(255, 255, 255, 0.25);  }
  </style>

  <script>
    (function() {
      if (window.location.pathname.endsWith('.html')) {
        var clean = window.location.pathname.replace(/\.html$/, '');
        if (clean === '/index') clean = '/';
        window.history.replaceState(null, '', clean + window.location.search + window.location.hash);
      }
    })();
  </script>
  <script>
    (function() {
      try {
        var raw = localStorage.getItem("alokpoth_theme") || localStorage.getItem("alokpoth-theme") || "dark";
        var valid = ["dark", "oled", "sapphire", "light", "eyecare"];
        var mode = raw;
        if (raw === "system") {
          mode = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? "dark" : "light";
        } else if (valid.indexOf(raw) === -1) {
          mode = "dark";
        }
        document.documentElement.setAttribute("data-theme-mode", raw);
        document.documentElement.setAttribute("data-theme", mode);
      } catch(e) {}
      if (window.location.pathname.endsWith('.html')) {
        var clean = window.location.pathname.replace(/\.html$/, '');
        if (clean === '/index') clean = '/';
        window.history.replaceState(null, '', clean + window.location.search + window.location.hash);
      }
    })();
  </script>
</head>
<body>
  <div id="toastEl" class="toast"></div>

  <!-- Top Navigation -->
  <header class="settings-nav">
    <a href="/account" class="settings-back-link" id="backBtn">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      <span id="backText">Settings</span>
    </a>
    <div class="nav-title" id="pageTitle">App Language</div>
    <div class="nav-actions">
      <button type="button" class="lang-pill-btn" id="langToggleBtn" title="Language Switch">
        <span id="langBtnText">BN</span>
      </button>
    </div>
  </header>

  <main class="content-container">
    <div class="settings-card">
      <div class="card-title">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span id="sectionTitle">Interface Language</span>
      </div>
      <p class="card-desc" id="sectionDesc">
        Choose your preferred language for menus, prompts, buttons, and app navigation. Changes will apply immediately.
      </p>

      <!-- Language Cards -->
      <div class="option-card-group" id="languageGroup" role="radiogroup" aria-labelledby="sectionTitle">
        <!-- Bengali -->
        <div class="option-card" data-lang="bn" role="radio" tabindex="0" aria-checked="false">
          <div class="option-lead">
            <div class="option-icon-badge" style="font-size:0.82rem;font-weight:700;letter-spacing:0.02em;">বাং</div>
            <div class="option-info">
              <span class="option-title" id="titleBn">বাংলা (Bengali)</span>
              <span class="option-desc" id="descBn">খাঁটি, সাবলীল ও সমৃদ্ধ বাংলা ইউজার ইন্টারফেস</span>
            </div>
          </div>
          <div class="option-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
        </div>

        <!-- English -->
        <div class="option-card" data-lang="en" role="radio" tabindex="0" aria-checked="false">
          <div class="option-lead">
            <div class="option-icon-badge" style="font-size:0.82rem;font-weight:700;letter-spacing:0.04em;">EN</div>
            <div class="option-info">
              <span class="option-title" id="titleEn">English (US / International)</span>
              <span class="option-desc" id="descEn">Clean and standardized international interface</span>
            </div>
          </div>
          <div class="option-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    let currentLanguage = localStorage.getItem("alokpoth_lang") || "en";

    const I18N = {
      bn: {
        back: "সেটিংস",
        pageTitle: "অ্যাপের ভাষা",
        sectionTitle: "ইন্টারফেস ভাষা",
        sectionDesc: "মেনু, বাটন এবং সম্পূর্ণ অ্যাপের জন্য আপনার পছন্দের ভাষা নির্বাচন করুন। এটি তাৎক্ষণিকভাবে কার্যকর হবে।",
        titleBn: "বাংলা (Bengali)",
        descBn: "খাঁটি, সাবলীল ও সমৃদ্ধ বাংলা ইউজার ইন্টারফেস",
        titleEn: "English (US / International)",
        descEn: "আন্তর্জাতিক মানসম্পন্ন ইংরেজি ইউজার ইন্টারফেস",
        saved: "ভাষা সফলভাবে পরিবর্তন করা হয়েছে!"
      },
      en: {
        back: "Settings",
        pageTitle: "App Language",
        sectionTitle: "Interface Language",
        sectionDesc: "Choose your preferred language for menus, buttons, and app navigation. Changes will apply immediately.",
        titleBn: "বাংলা (Bengali)",
        descBn: "Rich, native, and fluent Bengali user interface",
        titleEn: "English (US / International)",
        descEn: "Clean and standardized international interface",
        saved: "Language changed successfully!"
      }
    };

    function showToast(msg) {
      const el = document.getElementById("toastEl");
      if (!el) return;
      el.textContent = msg;
      el.className = "toast success";
      el.style.display = "block";
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { el.style.display = "none"; }, 2000);
    }

    function applyI18n() {
      const isEn = (currentLanguage === "en");
      const d = I18N[currentLanguage] || I18N.en;

      const langBtn = document.getElementById("langBtnText");
      if (langBtn) langBtn.textContent = isEn ? "বাং" : "EN";

      const backText = document.getElementById("backText");
      if (backText) backText.textContent = d.back;

      const pageTitle = document.getElementById("pageTitle");
      if (pageTitle) pageTitle.textContent = d.pageTitle;

      const sectionTitle = document.getElementById("sectionTitle");
      if (sectionTitle) sectionTitle.textContent = d.sectionTitle;

      const sectionDesc = document.getElementById("sectionDesc");
      if (sectionDesc) sectionDesc.textContent = d.sectionDesc;

      const titleBn = document.getElementById("titleBn");
      if (titleBn) titleBn.textContent = d.titleBn;

      const descBn = document.getElementById("descBn");
      if (descBn) descBn.textContent = d.descBn;

      const titleEn = document.getElementById("titleEn");
      if (titleEn) titleEn.textContent = d.titleEn;

      const descEn = document.getElementById("descEn");
      if (descEn) descEn.textContent = d.descEn;

      document.title = `${d.pageTitle} — Alora`;

      // Update active cards
      document.querySelectorAll("#languageGroup .option-card").forEach(card => {
        const isActive = (card.getAttribute("data-lang") === currentLanguage);
        card.classList.toggle("active", isActive);
        card.setAttribute("aria-checked", isActive ? "true" : "false");
      });
    }

    function setLanguage(lang) {
      if (currentLanguage === lang) return;
      currentLanguage = lang;
      try {
        localStorage.setItem("alokpoth_lang", lang);
      } catch (e) {}
      applyI18n();
      showToast((I18N[currentLanguage] || I18N.en).saved);
    }

    // Attach card click handlers
    document.querySelectorAll("#languageGroup .option-card").forEach(card => {
      card.addEventListener("click", () => {
        const lang = card.getAttribute("data-lang");
        setLanguage(lang);
      });
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          setLanguage(card.getAttribute("data-lang"));
        }
      });
    });

    // Back button navigation
    document.getElementById("backBtn")?.addEventListener("click", (e) => {
      if (window.history.length > 1 && document.referrer && document.referrer.includes(window.location.host)) {
        e.preventDefault();
        window.history.back();
      }
    });

    // Language Toggle pill button
    document.getElementById("langToggleBtn")?.addEventListener("click", () => {
      setLanguage(currentLanguage === "en" ? "bn" : "en");
    });

    applyI18n();
  </script>
</body>
</html>
