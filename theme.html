<!DOCTYPE html>
<html lang="en" data-theme="oled">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <title>Color Theme — Alora</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=3">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=3">
  <link rel="shortcut icon" href="favicon.ico?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #000000;
      --bg-card: rgba(22, 22, 26, 0.82);
      --bg-card-hover: rgba(30, 30, 36, 0.88);
      --border-card: rgba(255, 255, 255, 0.12);
      --border-divider: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-sub: #a1a1aa;
      --text-dim: #71717a;
      --accent-blue: #3b82f6;
      --font-main: 'Plus Jakarta Sans', 'Hind Siliguri', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    [data-theme="oled"] {
      --bg-base: #000000;
      --bg-card: rgba(18, 18, 22, 0.82);
      --bg-card-hover: rgba(26, 26, 32, 0.88);
      --border-card: rgba(255, 255, 255, 0.12);
      --border-divider: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-sub: #a1a1aa;
      --text-dim: #71717a;
    }

    [data-theme="eyecare"] {
      --bg-base: #f5eedc;
      --bg-card: rgba(245, 238, 220, 0.88);
      --bg-card-hover: rgba(238, 230, 210, 0.95);
      --border-card: rgba(146, 64, 14, 0.16);
      --border-divider: rgba(146, 64, 14, 0.08);
      --text-main: #4a3b2c;
      --text-sub: #7a6b5c;
      --text-dim: #9c8a77;
    }

    [data-theme="light"] {
      --bg-base: #f8fafc;
      --bg-card: rgba(255, 255, 255, 0.9);
      --bg-card-hover: rgba(245, 247, 250, 0.95);
      --border-card: rgba(0, 0, 0, 0.08);
      --border-divider: rgba(0, 0, 0, 0.06);
      --text-main: #09090b;
      --text-sub: #71717a;
      --text-dim: #52525b;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* ZERO HOVER TRANSLATEY / LIFTING */
    *:hover {
      transform: none !important;
    }
    button:active, a:active, .theme-item:active {
      transform: scale(0.98) !important;
      transition: transform 0.1s ease;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-top: env(safe-area-inset-top, 0);
      padding-bottom: env(safe-area-inset-bottom, 0);
      padding-left: env(safe-area-inset-left, 0);
      padding-right: env(safe-area-inset-right, 0);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Glisse Liquid Glass Navigation */
    .settings-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 60px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      backdrop-filter: blur(28px) saturate(190%) contrast(105%);
      -webkit-backdrop-filter: blur(28px) saturate(190%) contrast(105%);
      border-bottom: 1px solid var(--border-divider);
    }

    .settings-back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 9999px !important;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-card);
      color: var(--text-main);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      transition: background 0.15s ease;
    }
    :root[data-theme="light"] .settings-back-link {
      background: rgba(0, 0, 0, 0.04);
    }
    .settings-back-link svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.2;
    }

    .nav-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .lang-pill-btn {
      padding: 6px 14px;
      border-radius: 9999px !important;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-card);
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
    }
    :root[data-theme="light"] .lang-pill-btn {
      background: rgba(0, 0, 0, 0.04);
    }

    .content-container {
      width: 100%;
      max-width: 620px;
      margin: 24px auto;
      padding: 0 16px;
      flex: 1;
    }

    .themes-group {
      background: var(--bg-card);
      backdrop-filter: blur(28px) saturate(190%) contrast(105%);
      -webkit-backdrop-filter: blur(28px) saturate(190%) contrast(105%);
      border: 1px solid var(--border-card);
      border-radius: 20px !important;
      box-shadow: 0 12px 36px -4px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    .theme-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.15s ease;
    }

    .theme-item:hover {
      background: var(--bg-card-hover);
    }

    .theme-lead {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
    }

    .theme-swatch {
      width: 38px;
      height: 38px;
      border-radius: 9999px !important;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
    }

    .theme-swatch.oled {
      background: #000000;
      border-color: #3b82f6;
    }

    .theme-swatch.light {
      background: #ffffff;
      border-color: rgba(0, 0, 0, 0.15);
    }

    .theme-swatch.eyecare {
      background: #f5eedc;
      border-color: rgba(146, 64, 14, 0.3);
    }

    .theme-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .theme-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
    }

    .theme-desc {
      font-size: 13px;
      color: var(--text-sub);
    }

    .theme-check {
      width: 24px;
      height: 24px;
      border-radius: 9999px !important;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: transparent;
      transition: color 0.15s ease;
    }

    .theme-check svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: var(--accent-blue);
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .theme-item.active .theme-check {
      color: var(--accent-blue);
    }

    .row-divider {
      height: 1px;
      background: var(--border-divider);
      margin: 0 16px;
    }

    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 18, 22, 0.94);
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 9999px !important;
      font-size: 13.5px;
      font-weight: 500;
      z-index: 1000;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      display: none;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>

  <script>
    (function() {
      if (window.location.pathname.endsWith('.html')) {
        var clean = window.location.pathname.replace(/\.html$/, '');
        if (clean === '/index') clean = '/';
        window.history.replaceState(null, '', clean + window.location.search + window.location.hash);
      }
    })();
  </script>
</head>
<body>
  <div id="toastEl" class="toast"></div>

  <!-- Top Navigation -->
  <header class="settings-nav">
    <a href="account" class="settings-back-link" id="backBtn">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      <span id="backText">Settings</span>
    </a>
    <div class="nav-title" id="pageTitle">Color Theme</div>
    <div class="nav-actions">
      <button type="button" class="lang-pill-btn" id="langToggleBtn" title="Language Switch">
        <span id="langBtnText">EN</span>
      </button>
    </div>
  </header>

  <main class="content-container">
    <div class="themes-group">
      <!-- OLED Dark Mode -->
      <div class="theme-item" data-theme-id="oled">
        <div class="theme-lead">
          <div class="theme-swatch oled"></div>
          <div class="theme-info">
            <span class="theme-name" id="nameOled">Dark (OLED)</span>
            <span class="theme-desc" id="descOled">Pure AMOLED black for deep contrast & battery saving</span>
          </div>
        </div>
        <div class="theme-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      </div>

      <div class="row-divider"></div>

      <!-- Light Mode -->
      <div class="theme-item" data-theme-id="light">
        <div class="theme-lead">
          <div class="theme-swatch light"></div>
          <div class="theme-info">
            <span class="theme-name" id="nameLight">Light</span>
            <span class="theme-desc" id="descLight">Crisp, clean minimalist daytime appearance</span>
          </div>
        </div>
        <div class="theme-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      </div>

      <div class="row-divider"></div>

      <!-- Eye Care Mode -->
      <div class="theme-item" data-theme-id="eyecare">
        <div class="theme-lead">
          <div class="theme-swatch eyecare"></div>
          <div class="theme-info">
            <span class="theme-name" id="nameEyecare">Eye Care</span>
            <span class="theme-desc" id="descEyecare">Warm paper sepia tones for zero eye strain</span>
          </div>
        </div>
        <div class="theme-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      </div>
    </div>
  </main>

  <script>
    let currentLanguage = localStorage.getItem("alokpoth_lang") || "en";
    let rawSaved = localStorage.getItem("alokpoth_theme") || localStorage.getItem("alokpoth-theme") || "oled";
    // Normalize to only 3 supported modes: oled, light, eyecare
    let activeTheme = (rawSaved === "light" || rawSaved === "eyecare") ? rawSaved : "oled";
    
    function applyEffectiveTheme(themeId) {
      document.documentElement.setAttribute("data-theme-mode", themeId);
      document.documentElement.setAttribute("data-theme", themeId);
      
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) {
        if (themeId === "oled") meta.content = "#000000";
        else if (themeId === "light") meta.content = "#ffffff";
        else if (themeId === "eyecare") meta.content = "#f5eedc";
      }
    }

    applyEffectiveTheme(activeTheme);

    const I18N = {
      bn: {
        back: "সেটিংস",
        pageTitle: "চেহারা (থিম)",
        nameOled: "ডার্ক (ওলেড)",
        descOled: "পিওর অ্যামোলেড কালো (সর্বোচ্চ ব্যাটারি সেভিং)",
        nameLight: "লাইট",
        descLight: "পরিচ্ছন্ন ও উজ্জ্বল ডে-লাইট মোড",
        nameEyecare: "আই কেয়ার",
        descEyecare: "ওয়ার্ম সেপিয়া টোন (চোখের ক্লান্তিহীন পড়া)",
        applied: "থিম সক্রিয় করা হয়েছে"
      },
      en: {
        back: "Settings",
        pageTitle: "Color Theme",
        nameOled: "Dark (OLED)",
        descOled: "Pure AMOLED black for deep contrast & battery saving",
        nameLight: "Light",
        descLight: "Crisp, clean minimalist daytime appearance",
        nameEyecare: "Eye Care",
        descEyecare: "Warm paper sepia tones for zero eye strain",
        applied: "Theme applied successfully"
      }
    };

    function showToast(msg) {
      const el = document.getElementById("toastEl");
      if (!el) return;
      el.textContent = msg;
      el.style.display = "block";
      setTimeout(() => { el.style.display = "none"; }, 2500);
    }

    function applyI18n() {
      const isEn = (currentLanguage === "en");
      const d = I18N[currentLanguage] || I18N.en;

      document.getElementById("langBtnText").textContent = isEn ? "বাং" : "EN";
      document.getElementById("backText").textContent = d.back;
      document.getElementById("pageTitle").textContent = d.pageTitle;
      document.getElementById("nameOled").textContent = d.nameOled;
      document.getElementById("descOled").textContent = d.descOled;
      document.getElementById("nameLight").textContent = d.nameLight;
      document.getElementById("descLight").textContent = d.descLight;
      document.getElementById("nameEyecare").textContent = d.nameEyecare;
      document.getElementById("descEyecare").textContent = d.descEyecare;
      document.title = `${d.pageTitle} — Alora`;
    }

    function syncActiveThemeUI() {
      document.querySelectorAll(".theme-item").forEach(item => {
        const t = item.getAttribute("data-theme-id");
        item.classList.toggle("active", t === activeTheme);
      });
    }

    document.querySelectorAll(".theme-item").forEach(item => {
      item.addEventListener("click", () => {
        const themeId = item.getAttribute("data-theme-id");
        if (!themeId) return;
        activeTheme = themeId;
        applyEffectiveTheme(activeTheme);
        localStorage.setItem("alokpoth_theme", activeTheme);
        localStorage.setItem("alokpoth-theme", activeTheme);
        syncActiveThemeUI();
        const d = I18N[currentLanguage] || I18N.en;
        showToast(d.applied);
      });
    });

    document.getElementById("backBtn")?.addEventListener("click", (e) => {
      if (window.history.length > 1 && document.referrer && document.referrer.includes(window.location.host)) {
        e.preventDefault();
        window.history.back();
      }
    });

    document.getElementById("langToggleBtn")?.addEventListener("click", () => {
      currentLanguage = (currentLanguage === "en" ? "bn" : "en");
      try { localStorage.setItem("alokpoth_lang", currentLanguage); } catch {}
      applyI18n();
    });

    applyI18n();
    syncActiveThemeUI();
  </script>
</body>
</html>
