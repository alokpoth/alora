# GitLab Pages deployment pipeline for Alora AI
image: alpine:latest

pages:
  stage: deploy
  script:
    - mkdir -p public
    # Copy all static root files
    - cp -r *.html public/ 2>/dev/null || true
    - cp -r *.json *.js *.css CNAME robots.txt sitemap.xml site.webmanifest public/ 2>/dev/null || true
    - cp -r *.png *.jpg *.jpeg *.svg *.ico *.webp public/ 2>/dev/null || true
    - cp -r *.apk *.ipa public/ 2>/dev/null || true
    - cp -r avatars logo utils public/ 2>/dev/null || true
    # Create clean URL directories (e.g. /download -> /download/index.html)
    - |
      for f in *.html; do
        [ -f "$f" ] || continue
        name="${f%.html}"
        if [ "$name" != "index" ] && [ "$name" != "404" ]; then
          mkdir -p "public/$name"
          cp "$f" "public/$name/index.html"
        fi
      done
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
