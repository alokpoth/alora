# GitLab Pages deployment pipeline for Alora AI (ChatGPT Clean URLs)
image: alpine:latest

pages:
  stage: deploy
  script:
    - mkdir -p public
    # Copy ONLY explicit safe public static files (never backend utils/, package*.json, vercel.json, or .env)
    - cp *.html _redirects CNAME public/ 2>/dev/null || true
    - cp manifest.json sw.js robots.txt sitemap.xml site.webmanifest public/ 2>/dev/null || true
    - cp *.png *.jpg *.jpeg *.svg *.ico *.webp public/ 2>/dev/null || true
    - cp *.apk *.ipa public/ 2>/dev/null || true
    - cp -r avatars .well-known public/ 2>/dev/null || true
    # Create clean URL directories (e.g. /download -> /download/index.html)
    - |
      for f in *.html; do
        [ -f "$f" ] || continue
        name="${f%.html}"
        if [ "$name" != "index" ] && [ "$name" != "404" ]; then
          mkdir -p "public/$name"
          cp "$f" "public/$name/index.html"
        fi
      done
    - rm -f public/zihan.html public/admin.html || true
    # ChatGPT alias directories (/auth/login, /auth/signup, /signup, /pricing, /settings, /app)
    - mkdir -p public/auth/login public/auth/signup public/signup public/pricing public/settings public/app
    - cp login.html public/auth/login/index.html
    - cp login.html public/auth/signup/index.html
    - cp login.html public/signup/index.html
    - cp plans.html public/pricing/index.html
    - cp index.html public/settings/index.html
    - cp download.html public/app/index.html
    # Legacy settings pages now live inside the in-app Settings dialog
    - |
      for pair in theme:general language:general sound:speech usage:account subscription:account; do
        page="${pair%%:*}"; tab="${pair##*:}"
        mkdir -p "public/$page"
        html="<!DOCTYPE html><meta charset=\"utf-8\"><meta http-equiv=\"refresh\" content=\"0;url=/#settings/$tab\"><script>location.replace('/#settings/$tab')</script>"
        echo "$html" > "public/$page/index.html"
        echo "$html" > "public/$page.html"
      done
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
