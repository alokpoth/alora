<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#212121">
  <title>Redeem Code — Alora</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3">
  <link rel="shortcut icon" href="/favicon.ico?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #212121;
      --bg-card: #171717;
      --bg-card-hover: #2f2f2f;
      --border-card: rgba(255, 255, 255, 0.08);
      --border-divider: rgba(255, 255, 255, 0.06);
      --text-main: #ececec;
      --text-sub: #b4b4b4;
      --text-dim: #8e8e8e;
      --accent-blue: #ececec;
      --accent-ink: #0d0d0d;
      --accent-purple: var(--accent-blue);
      --accent-purple-gradient: var(--accent-blue);
      --font-main: 'Plus Jakarta Sans', 'Hind Siliguri', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    [data-theme="dark"] {
      --bg-base: #212121;
      --bg-card: #171717;
      --bg-card-hover: #2f2f2f;
      --border-card: rgba(255, 255, 255, 0.08);
      --border-divider: rgba(255, 255, 255, 0.06);
      --text-main: #ececec;
      --text-sub: #b4b4b4;
    }

    [data-theme="oled"] {
      --bg-base: #000000;
      --bg-card: #111113;
      --bg-card-hover: #1c1c1f;
      --border-card: rgba(255, 255, 255, 0.12);
      --border-divider: rgba(255, 255, 255, 0.06);
      --text-main: #ececec;
      --text-sub: #b4b4b4;
    }

    [data-theme="sapphire"] {
      --bg-base: #070d19;
      --bg-card: #0f1c32;
      --bg-card-hover: #152744;
      --border-card: rgba(56, 189, 248, 0.15);
      --border-divider: rgba(56, 189, 248, 0.08);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    [data-theme="eyecare"] {
      --bg-base: #f5eedc;
      --bg-card: #eadeca;
      --bg-card-hover: #dfcfb8;
      --border-card: rgba(146, 64, 14, 0.15);
      --border-divider: rgba(146, 64, 14, 0.08);
      --text-main: #4a3b2c;
      --text-sub: #7a6b5c;
      --text-dim: #9e8e7e;
    
      --accent-blue: #2d2318;
      --accent-blue-hover: #1f170f;
      --accent-ink: #f5eedc;}

    [data-theme="light"] {
      --bg-base: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #ececec;
      --border-card: rgba(0, 0, 0, 0.08);
      --border-divider: rgba(0, 0, 0, 0.05);
      --text-main: #0d0d0d;
      --text-sub: #b4b4b4;
      --text-dim: #52525b;
    
      --accent-blue: #0d0d0d;
      --accent-blue-hover: #2f2f2f;
      --accent-ink: #ffffff;}

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-font-smoothing: antialiased;
    }

    a {
      text-decoration: none !important;
      color: inherit;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      padding-bottom: max(32px, env(safe-area-inset-bottom, 20px));
      transition: background-color 0.2s ease;
    }

    /* Top Navigation Bar */
    .settings-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border-divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: calc(56px + env(safe-area-inset-top, 0px));
      padding: env(safe-area-inset-top, 0px) 16px 0 16px;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .settings-back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 8px;
      transition: opacity 0.15s;
    }
    .settings-back-link:active {
      opacity: 0.7;
    }
    .settings-back-link svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.4;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lang-pill-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-card);
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 9999px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .lang-pill-btn:active {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Main Container */
    .content-container {
      width: 100%;
      max-width: 580px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .redeem-hero-card {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 26px 20px;
      text-align: center;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .redeem-icon-box {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: none;
    }
    .redeem-icon-box svg {
      width: 32px;
      height: 32px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .redeem-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #ffffff;
    }

    .redeem-desc {
      font-size: 0.9rem;
      color: var(--text-sub);
      line-height: 1.5;
      max-width: 440px;
    }

    .settings-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: none;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .code-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      height: 52px;
      background: rgba(0, 0, 0, 0.35);
      border: 1.5px solid var(--border-card);
      border-radius: 14px;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      box-sizing: border-box;
      overflow: hidden;
    }
    .code-input-wrap:focus-within {
      border-color: var(--accent-blue);
      box-shadow: none;
    }

    .code-input-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      padding-left: 14px;
      padding-right: 2px;
      color: var(--text-dim, #a1a1aa);
      flex-shrink: 0;
      pointer-events: none;
    }
    .code-input-icon svg {
      width: 20px;
      height: 20px;
    }

    .code-input {
      flex: 1;
      min-width: 0;
      height: 100%;
      padding: 0 12px;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1.05rem;
      font-weight: 700;
      font-family: monospace;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      outline: none;
      box-sizing: border-box;
    }
    .code-input::placeholder {
      color: var(--text-dim, #71717a);
      font-family: var(--font-main);
      letter-spacing: 0;
      font-weight: 500;
      font-size: 0.92rem;
      text-transform: none;
      opacity: 0.65;
    }

    .btn-paste {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: var(--text-sub);
      font-size: 0.78rem;
      font-weight: 600;
      font-family: var(--font-main);
      padding: 7px 12px;
      border-radius: 9px;
      margin-right: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      flex-shrink: 0;
      user-select: none;
    }
    .btn-paste:hover {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .btn-paste:active {
      transform: scale(0.96);
    }

    [data-theme="light"] .code-input-wrap {
      background: #f8fafc;
      border-color: rgba(0, 0, 0, 0.14);
    }
    [data-theme="light"] .code-input {
      color: #09090b;
    }
    [data-theme="light"] .btn-paste {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
      color: var(--text-main);
    }

    [data-theme="eyecare"] .code-input-wrap {
      background: #ede3ce;
      border-color: rgba(146, 64, 14, 0.2);
    }
    [data-theme="eyecare"] .code-input {
      color: #4a3b2c;
    }
    [data-theme="eyecare"] .btn-paste {
      background: rgba(146, 64, 14, 0.12);
      border-color: rgba(146, 64, 14, 0.25);
      color: #9a3412;
    }

    .btn-claim {
      width: 100%;
      height: 50px;
      border-radius: 14px;
      background: var(--accent-blue); color: var(--accent-ink, #0d0d0d);
      color: var(--accent-ink, #0d0d0d);
      border: none;
      font-size: 1.05rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: none;
      transition: opacity 0.15s, transform 0.15s;
      margin-top: 10px;
    }
    .btn-claim:hover {
      opacity: 0.95;
    }
    .btn-claim:active {
      transform: scale(0.98);
    }
    .btn-claim:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Confetti Canvas */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 500;
      color: #ffffff;
      background: rgba(24, 24, 27, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: none;
      z-index: 1000;
      display: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      white-space: nowrap;
    }
    .toast.success { border-color: rgba(255, 255, 255, 0.25);  }
    .toast.error { border-color: #ef4444; }
  


    
    /* Clean Modern Controls (Vercel/Linear Design System) */
    button, .btn, .btn-primary, .btn-secondary, .btn-claim, .btn-paste, .page-back-btn, .btn-test-sound, .auth-btn, .download-btn, .plan-cta-btn, .plan-toggle-btn, .pill-btn, .tab-btn, .cta-btn, .submit-btn, .back-btn, .settings-back-link {
      border-radius: 9999px !important;
      transform: none !important;
      transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease !important;
    }
    button:hover, .btn:hover, .btn-primary:hover, .btn-secondary:hover, .page-back-btn:hover, .option-card:hover, .btn-test-sound:hover, .auth-btn:hover, .download-btn:hover {
      transform: none !important;
      box-shadow: none;
    }
    button:active, .btn:active, .btn-primary:active, .btn-secondary:active, .page-back-btn:active, .option-card:active, .btn-test-sound:active, .auth-btn:active, .download-btn:active {
      transform: scale(0.975) !important;
    }
    input, .auth-input, .custom-dialog-input, .search-input, .code-input-wrap {
      border-radius: 18px !important;
    }
    .card, .auth-card, .plan-card, .profile-card, .settings-group, .settings-card, .help-card, .modal-sheet, .custom-dialog-box, .content-card, .feature-card, .modal-box, .glass-panel, .info-box, .account-card {
      border-radius: 24px !important;
    }
    .badge, .status-pill, .role-pill, .filter-chip {
      border-radius: 9999px !important;
    }

</style>
<script>
  (function() {
    if (window.location.pathname.endsWith('.html')) {
      var clean = window.location.pathname.replace(/\.html$/, '');
      if (clean === '/index') clean = '/';
      window.history.replaceState(null, '', clean + window.location.search + window.location.hash);
    }
  })();
</script>
<script>
  (function() {
      try {
        var raw = localStorage.getItem("alokpoth_theme") || localStorage.getItem("alokpoth-theme") || "dark";
        var valid = ["dark", "oled", "sapphire", "light", "eyecare"];
        var mode = raw;
        if (raw === "system") {
          mode = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? "dark" : "light";
        } else if (valid.indexOf(raw) === -1) {
          mode = "dark";
        }
        document.documentElement.setAttribute("data-theme-mode", raw);
        document.documentElement.setAttribute("data-theme", mode);
      } catch(e) {}
      if (window.location.pathname.endsWith('.html')) {
        var clean = window.location.pathname.replace(/\.html$/, '');
        if (clean === '/index') clean = '/';
        window.history.replaceState(null, '', clean + window.location.search + window.location.hash);
      }
    })();
</script>
</head>
<body>
  <canvas id="confettiCanvas"></canvas>
  <div id="toastEl" class="toast"></div>

  <!-- Top Navigation -->
  <header class="settings-nav">
    <a href="/account" class="settings-back-link" id="backBtn">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      <span id="backText">Settings</span>
    </a>
    <div class="nav-title" id="pageTitle">Redeem Code</div>
    <div class="nav-actions">
      <button type="button" class="lang-pill-btn" id="langToggleBtn" title="Language Switch">
        <span id="langBtnText">EN</span>
      </button>
    </div>
  </header>

  <main class="content-container">
    <div class="redeem-hero-card">
      <div class="redeem-icon-box">
        <svg viewBox="0 0 24 24"><path d="M20 12V22H4V12"/><path d="M22 7H2V12H22V7Z"/><path d="M12 22V7"/><path d="M12 7H7.5A2.5 2.5 0 0 1 7.5 2C11 2 12 7 12 7Z"/><path d="M12 7H16.5A2.5 2.5 0 0 0 16.5 2C13 2 12 7 12 7Z"/></svg>
      </div>
      <div class="redeem-title" id="heroTitle">Unlock Premium Privileges</div>
      <p class="redeem-desc" id="heroDesc">
        Enter your promotional voucher or gift code to immediately activate Go, Plus, Pro, or Max plan advantages on your account.
      </p>
    </div>

    <div class="settings-card">
      <form id="redeemForm">
        <div class="form-group">
          <label class="form-label" id="labelCode" for="redeemCodeInput">Redeem Voucher Code</label>
          <div class="code-input-wrap">
            <div class="code-input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="14" x="2" y="5" rx="2"/>
                <line x1="2" x2="22" y1="10" y2="10"/>
              </svg>
            </div>
            <input type="text" class="code-input" id="redeemCodeInput" placeholder="e.g. ALO-PRO-XXXXXX or PROMO" maxlength="50" required autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
            <button type="button" class="btn-paste" id="btnPasteCode" title="Paste Code" aria-label="Paste from clipboard">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="8" height="4" x="8" y="2" rx="1" ry="1"/>
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
              </svg>
              <span id="btnPasteText">Paste</span>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-claim" id="claimRedeemBtn">
          <span id="btnClaimText">Claim &amp; Upgrade</span>
        </button>
      </form>
    </div>
  </main>

  <script>
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const BACKEND_URL = isLocal
      ? (window.location.port === '5000' ? '' : 'http://localhost:5000')
      : (window.location.hostname.endsWith('onrender.com') ? '' : 'https://alora-backend-emw3.onrender.com');
    const API_BASE = BACKEND_URL + "/api";

    const token = localStorage.getItem("alokpoth_token");
    if (!token) {
      window.location.href = "/auth/login";
    }

    let currentLanguage = localStorage.getItem("alokpoth_lang") || "en";
    const rawSavedTheme = localStorage.getItem("alokpoth_theme") || localStorage.getItem("alokpoth-theme") || "system";
    const isDarkRedeem = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const savedTheme = (rawSavedTheme === "system") ? (isDarkRedeem ? "dark" : "light") : rawSavedTheme;
    document.documentElement.setAttribute("data-theme", savedTheme);

    const I18N = {
      bn: {
        back: "সেটিংস",
        pageTitle: "রিডিম কোড",
        heroTitle: "প্রিমিয়াম সুবিধা আনলক করুন",
        heroDesc: "আপনার প্রমো ভাউচার বা গিফট কোড প্রবেশ করিয়ে অবিলম্বে Go, Plus, Pro বা Max প্ল্যান সুবিধা চালু করুন।",
        labelCode: "রিডিম ভাউচার কোড",
        placeholder: "যেমন: ALO-PRO-XXXXXX বা কোড",
        btnClaim: "ক্লেইম ও আপগ্রেড করুন",
        verifying: "যাচাই হচ্ছে...",
        emptyCode: "অনুগ্রহ করে রিডিম কোডটি লিখুন",
        serverErr: "সার্ভারের সাথে যোগাযোগ করা যায়নি",
        paste: "পেস্ট",
        pasted: "ক্লিপবোর্ড থেকে পেস্ট করা হয়েছে!",
        clipboardErr: "ক্লিপবোর্ড পড়ার অনুমতি দিন বা সরাসরি লিখুন"
      },
      en: {
        back: "Settings",
        pageTitle: "Redeem Code",
        heroTitle: "Unlock Premium Privileges",
        heroDesc: "Enter your promotional voucher or gift code to immediately activate Go, Plus, Pro, or Max plan advantages on your account.",
        labelCode: "Redeem Voucher Code",
        placeholder: "e.g. ALO-PRO-XXXXXX or code",
        btnClaim: "Claim & Upgrade",
        verifying: "Verifying...",
        emptyCode: "Please enter a redeem code",
        serverErr: "Could not connect to server",
        paste: "Paste",
        pasted: "Pasted from clipboard!",
        clipboardErr: "Please allow clipboard access or type code directly"
      }
    };

    function showToast(msg, type = "success") {
      const el = document.getElementById("toastEl");
      if (!el) return;
      el.textContent = msg;
      el.className = `toast ${type}`;
      el.style.display = "block";
      setTimeout(() => { el.style.display = "none"; }, 3500);
    }

    function applyI18n() {
      const isEn = (currentLanguage === "en");
      const d = I18N[currentLanguage] || I18N.en;

      document.getElementById("langBtnText").textContent = isEn ? "বাং" : "EN";
      document.getElementById("backText").textContent = d.back;
      document.getElementById("pageTitle").textContent = d.pageTitle;
      document.getElementById("heroTitle").textContent = d.heroTitle;
      document.getElementById("heroDesc").textContent = d.heroDesc;
      document.getElementById("labelCode").textContent = d.labelCode;
      document.getElementById("redeemCodeInput").placeholder = d.placeholder;
      document.getElementById("btnClaimText").textContent = d.btnClaim;
      const btnPasteText = document.getElementById("btnPasteText");
      if (btnPasteText) btnPasteText.textContent = d.paste;
      document.title = `${d.pageTitle} — Alora`;
    }

    // Confetti Engine
    let confettiAnimId = null;
    function triggerConfetti() {
      const canvas = document.getElementById("confettiCanvas");
      if (!canvas) return;
      if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ["#ffffff", "#e4e4e7", "#a1a1aa", "#71717a", "#d4d4d8"];

      for (let i = 0; i < 90; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          w: Math.random() * 8 + 4,
          h: Math.random() * 6 + 4,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.7) * 16,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 10,
          opacity: 1
        });
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.35; // gravity
          p.rotation += p.rotSpeed;
          p.opacity -= 0.012;

          if (p.opacity > 0) {
            alive = true;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.opacity);
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
          }
        });

        if (alive) {
          confettiAnimId = requestAnimationFrame(render);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      render();
    }

    // Code input uppercase auto-format
    const inputEl = document.getElementById("redeemCodeInput");
    inputEl?.addEventListener("input", (e) => {
      e.target.value = e.target.value.toUpperCase().replace(/\s+/g, "");
    });

    // Paste button handler
    const btnPaste = document.getElementById("btnPasteCode");
    if (btnPaste) {
      btnPaste.addEventListener("click", async () => {
        const d = I18N[currentLanguage] || I18N.en;
        try {
          if (navigator.clipboard && navigator.clipboard.readText) {
            const clipText = await navigator.clipboard.readText();
            if (clipText && clipText.trim()) {
              inputEl.value = clipText.trim().toUpperCase().replace(/\s+/g, "");
              inputEl.dispatchEvent(new Event("input", { bubbles: true }));
              inputEl.focus();
              showToast(d.pasted, "success");
              return;
            }
          }
        } catch(err) {
          console.warn("[Redeem] Clipboard access:", err);
          showToast(d.clipboardErr, "error");
        }
        inputEl.focus();
      });
    }

    // Form submit
    document.getElementById("redeemForm")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const d = I18N[currentLanguage] || I18N.en;
      const code = inputEl.value.trim();
      if (!code) {
        showToast(d.emptyCode, "error");
        return;
      }

      const claimBtn = document.getElementById("claimRedeemBtn");
      const btnText = document.getElementById("btnClaimText");
      claimBtn.disabled = true;
      btnText.textContent = d.verifying;

      try {
        const res = await fetch(`${API_BASE}/redeem/claim`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ code })
        });
        if (res.status === 401) {
          localStorage.removeItem("alokpoth_token");
          showToast(currentLanguage === "en" ? "Session expired. Please log in again." : "লগইন সেশন শেষ হয়ে গেছে। অনুগ্রহ করে আবার লগইন করুন।", "error");
          setTimeout(() => { window.location.href = "/"; }, 1500);
          return;
        }
        const data = await res.json();
        if (res.ok && data.success) {
          const newPlan = data.plan_name || (data.subscription && data.subscription.plan_name) || "Pro";
          const expiresAt = data.expires_at || (data.subscription && data.subscription.expires_at);

          localStorage.setItem("alokpoth_current_plan", newPlan);
          localStorage.setItem("alokpoth_user_plan", newPlan);
          localStorage.setItem("alokpoth_plan", newPlan);
          if (expiresAt) {
            localStorage.setItem("alokpoth_plan_expiry", expiresAt);
            localStorage.setItem("alokpoth_plan_expires_at", expiresAt);
          }
          if (data.token) localStorage.setItem("alokpoth_token", data.token);

          const userStr = localStorage.getItem("alokpoth_user");
          if (userStr) {
            try {
              const u = JSON.parse(userStr);
              if (!u.subscription) u.subscription = {};
              u.subscription.plan_name = newPlan;
              u.subscription.expires_at = expiresAt;
              u.plan = newPlan;
              localStorage.setItem("alokpoth_user", JSON.stringify(u));
            } catch {}
          }

          inputEl.value = "";
          triggerConfetti();
          const successMsg = currentLanguage === "en" 
            ? (data.message || `Congratulations! Your '${newPlan}' plan is now active.`)
            : (data.message || `অভিনন্দন! আপনার '${newPlan}' প্ল্যান সক্রিয় হয়েছে।`);
          showToast(successMsg, "success");
          setTimeout(() => { window.location.href = "/#settings/account"; }, 1600);
        } else {
          showToast(data.error || (currentLanguage === "en" ? "Invalid or expired promo code!" : "অবৈধ বা মেয়াদোত্তীর্ণ রিডিম কোড!"), "error");
        }
      } catch {
        showToast(d.serverErr, "error");
      } finally {
        claimBtn.disabled = false;
        btnText.textContent = d.btnClaim;
      }
    });

    // Back button navigation
    document.getElementById("backBtn")?.addEventListener("click", (e) => {
      if (window.history.length > 1 && document.referrer && document.referrer.includes(window.location.host)) {
        e.preventDefault();
        window.history.back();
      }
    });

    // Toggle Language
    document.getElementById("langToggleBtn")?.addEventListener("click", () => {
      currentLanguage = (currentLanguage === "en" ? "bn" : "en");
      try { localStorage.setItem("alokpoth_lang", currentLanguage); } catch {}
      applyI18n();
    });

    applyI18n();
  </script>
</body>
</html>
